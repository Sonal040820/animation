name: Camber GPU / Blender acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camber-gpu-acceptance
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Camber CLI without API token
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            https://cli.cambercloud.com/install-v2.sh --output "$RUNNER_TEMP/install-camber.sh"
          bash "$RUNNER_TEMP/install-camber.sh" >/dev/null
          echo "$HOME/.camber/bin" >> "$GITHUB_PATH"

      - name: Authenticate and stage probe (no identity artifact)
        env:
          CAMBER_API_KEY: ${{ secrets.CAMBER_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$CAMBER_API_KEY" ]] || { echo "CAMBER_AUTH_REQUIRED"; exit 1; }
          camber me --output json > "$RUNNER_TEMP/camber-identity.json" 2>/dev/null
          USERNAME=$(python3 - <<'PY'
          import json,os
          with open(os.path.join(os.environ["RUNNER_TEMP"],"camber-identity.json"), encoding="utf-8") as f:
              data=json.load(f)
          print(data.get("username") or data.get("unique_name") or data.get("name") or "")
          PY
          )
          [[ -n "$USERNAME" && "$USERNAME" =~ ^[a-zA-Z0-9_-]+$ ]] || {
            echo "CAMBER_ACCOUNT_IDENTIFIER_UNAVAILABLE"; exit 1;
          }
          echo "::add-mask::$USERNAME"
          STASH_DIR="stash://$USERNAME/kai-ren-gpu-smoke-${GITHUB_RUN_ID}"
          echo "::add-mask::$STASH_DIR"
          printf '%s\n' "$STASH_DIR" > "$RUNNER_TEMP/camber-stash-path"
          camber stash mkdir "$STASH_DIR" >/dev/null 2>&1 || {
            echo "CAMBER_STASH_MKDIR_FAILED"; exit 1;
          }
          camber stash cp blender/camber/gpu_probe.sh "$STASH_DIR/gpu_probe.sh" >/dev/null 2>&1
          camber stash cp blender/camber/cycles_probe.py "$STASH_DIR/cycles_probe.py" >/dev/null 2>&1
          echo "CAMBER_PROBE_STAGED"

      - name: Allocate Xsmall GPU and run bounded Blender probe
        env:
          CAMBER_API_KEY: ${{ secrets.CAMBER_API_KEY }}
        run: |
          set -euo pipefail
          STASH_DIR=$(cat "$RUNNER_TEMP/camber-stash-path")
          if ! camber job create --engine base --gpu --size xsmall --num-nodes 1 \
            --path "$STASH_DIR/" --cmd "timeout 600s bash ./gpu_probe.sh" \
            > "$RUNNER_TEMP/camber-create-result" 2>&1; then
            python3 - <<'PY'
          import json,os,re
          root=os.environ["RUNNER_TEMP"]
          raw=open(os.path.join(root,"camber-create-result"),encoding="utf-8",errors="replace").read()
          identity=json.load(open(os.path.join(root,"camber-identity.json"),encoding="utf-8"))
          key=os.environ.get("CAMBER_API_KEY","")
          if key: raw=raw.replace(key,"[SECRET]")
          for field in ("username","unique_name","name","email","id","user_id","workspace"):
              value=identity.get(field)
              if isinstance(value,str) and len(value)>2:
                  raw=raw.replace(value,"[ACCOUNT]")
          raw=re.sub(r"stash://[^\s'\"\\]+","[STASH_PATH]",raw)
          raw=re.sub(r"[\w.+-]+@[\w.-]+","[EMAIL]",raw)
          raw=re.sub(r"(?i)(bearer\s+)[a-z0-9._=/-]+",r"\1[SECRET]",raw)
          raw=re.sub(r"\b[a-zA-Z0-9_=-]{30,}\b","[REDACTED]",raw)
          print("CAMBER_SUBMISSION_ERROR_REDACTED:",raw.strip()[:700] or "[empty response]")
          PY
            echo "CAMBER_GPU_SUBMISSION_FAILED"
            exit 1
          fi
          JOB_ID=$(python3 - <<'PY'
          import re,os
          s=open(os.path.join(os.environ["RUNNER_TEMP"],"camber-create-result"),encoding="utf-8").read()
          m=re.search(r"Job\s*ID:\s*(\d+)",s,re.I)
          print(m.group(1) if m else "")
          PY
          )
          if [[ ! "$JOB_ID" =~ ^[0-9]+$ ]]; then
            echo "CAMBER_JOB_ID_UNAVAILABLE; check Camber dashboard for submitted job"
            exit 1
          fi
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "CAMBER_GPU_JOB_SUBMITTED"

      - name: Wait for remote test completion
        env:
          CAMBER_API_KEY: ${{ secrets.CAMBER_API_KEY }}
        run: |
          set -euo pipefail
          result="UNKNOWN"
          for i in $(seq 1 105); do
            if camber job get "$JOB_ID" --output json > "$RUNNER_TEMP/camber-job-status.json" 2>/dev/null; then
              result=$(python3 - <<'PY'
          import json,os
          j=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"camber-job-status.json")))
          if isinstance(j,dict):
              obj=j.get("job") if isinstance(j.get("job"),dict) else j
              status=obj.get("status",obj.get("state","UNKNOWN"))
              if isinstance(status,dict): status=status.get("name",status.get("value","UNKNOWN"))
              print(str(status).upper())
          else: print("UNKNOWN")
          PY
              )
              case "$result" in
                COMPLETED|SUCCEEDED|SUCCESS) echo "CAMBER_REMOTE_JOB_COMPLETED"; break;;
                FAILED|ERROR|CANCELLED|CANCELED|STOPPED|TIMED_OUT)
                  echo "CAMBER_REMOTE_JOB_FAILED: $result"; exit 1;;
              esac
            fi
            sleep 8
          done
          case "$result" in
            COMPLETED|SUCCEEDED|SUCCESS) ;;
            *) echo "CAMBER_JOB_STATUS_UNCONFIRMED; remote command self-times-out at 600 seconds"; exit 1;;
          esac

      - name: Verify GPU and actual Blender render through downloaded logs
        env:
          CAMBER_API_KEY: ${{ secrets.CAMBER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/job-logs"
          if ! camber job logs "$JOB_ID" "$RUNNER_TEMP/job-logs" \
              > "$RUNNER_TEMP/job-logs/download-output.txt" 2>&1; then
            camber job log "$JOB_ID" "$RUNNER_TEMP/job-logs" \
              > "$RUNNER_TEMP/job-logs/download-output.txt" 2>&1 || {
              echo "CAMBER_LOG_DOWNLOAD_FAILED"; exit 1;
            }
          fi
          grep -R -q -F 'GPU_ALLOC_PASS' "$RUNNER_TEMP/job-logs" || {
            echo "GPU_ALLOCATION_NOT_PROVEN"; exit 1;
          }
          grep -R -q -F 'CYCLES_GPU_RENDER_PASS' "$RUNNER_TEMP/job-logs" || {
            echo "BLENDER_GPU_RENDER_NOT_PROVEN"; exit 1;
          }
          grep -R -q -F 'GPU_PROBE_PASS' "$RUNNER_TEMP/job-logs" || {
            echo "GPU_PROBE_INCOMPLETE"; exit 1;
          }
          echo "GPU_ALLOC_PASS"
          echo "CYCLES_GPU_RENDER_PASS"
          echo "GPU_PROBE_PASS"
          printf 'GPU allocation: PASS\nBlender Cycles GPU render: PASS\nRemote probe limit: 600 seconds\n' > gpu-acceptance.txt

      - name: Upload only sanitized acceptance result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camber-gpu-acceptance
          path: gpu-acceptance.txt
          retention-days: 3
          if-no-files-found: error

      - name: Clean up temporary Camber inputs
        if: always()
        env:
          CAMBER_API_KEY: ${{ secrets.CAMBER_API_KEY }}
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/camber-stash-path" && -n "$CAMBER_API_KEY" ]]; then
            STASH_DIR=$(cat "$RUNNER_TEMP/camber-stash-path")
            if [[ "$STASH_DIR" == stash://*/kai-ren-gpu-smoke-${GITHUB_RUN_ID} ]]; then
              camber stash rm -rf "$STASH_DIR" >/dev/null 2>&1 || true
            fi
          fi
          echo "Stash cleanup attempted without exposing account paths"
