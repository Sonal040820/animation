name: Blender environment setup (no rendering)
on:
  workflow_dispatch:
  push:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-environment.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate contracts and Python code without Blender
        run: |
          python3 --version
          python3 -m compileall -q blender
          python3 blender/scripts/validate_contracts.py
          python3 -m unittest discover -s blender/tests -v
      - name: Install only Blender runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl xz-utils libx11-6 libxi6 libxrender1 libxrandr2 libxfixes3 libxkbcommon0 libgl1 libegl1 libsm6 libxext6 libxxf86vm1
      - uses: actions/cache@v4
        with:
          path: .cache/blender/blender-4.5.16-linux-x64
          key: blender-linux-x64-4.5.16-runtime-v1
      - name: Download and SHA-256 verify official Blender LTS
        run: bash blender/scripts/install_blender.sh
      - name: Probe actual Blender Python APIs WITHOUT rendering
        run: |
          BIN="$GITHUB_WORKSPACE/.cache/blender/blender-4.5.16-linux-x64/blender"
          "$BIN" --background --factory-startup --disable-autoexec --python-exit-code 1 --python blender/scripts/doctor.py -- --output "$RUNNER_TEMP/blender-diagnostics.json"
          test -s "$RUNNER_TEMP/blender-diagnostics.json"
          cp "$RUNNER_TEMP/blender-diagnostics.json" blender-diagnostics.json
      - name: Archive environment diagnostics (JSON only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-no-render-diagnostics
          path: blender-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
