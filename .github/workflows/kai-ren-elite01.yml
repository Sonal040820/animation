name: Kai–Ren cinematic rigged encounter
on:
  workflow_dispatch:
  push:
    paths:
      - 'blender/scripts/kai_ren_elite01.py'
      - 'blender/scripts/kai_ren_audio.py'
      - '.github/workflows/kai-ren-elite01.yml'
permissions:
  contents: read
concurrency:
  group: kai-ren-cinematic-elite01
  cancel-in-progress: true
jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax and rights-approved 3D character sources
        run: |
          set -euo pipefail
          python3 -m py_compile \
            blender/studio/combat.py \
            blender/scripts/kai_ren_elite01.py \
            blender/scripts/kai_ren_audio.py \
            blender/scripts/provision_anime_males.py
          python3 blender/scripts/provision_anime_males.py > /dev/null
          python3 blender/scripts/validate_contracts.py --verify-files \
            --asset-id vroid_hair_sample_male --asset-id vroid_sakurada_fumiriya > /dev/null
          echo "LICENSED_AVATAR_SOURCE_AND_SHA256_PASS"
      - name: Install headless render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils libx11-6 libxi6 libxrender1 \
            libxrandr2 libxfixes3 libxkbcommon0 libgl1 libegl1 \
            libsm6 libxext6 libxxf86vm1 ffmpeg
      - uses: actions/cache@v4
        with:
          path: .cache/blender/blender-4.5.16-linux-x64
          key: blender-linux-x64-4.5.16-runtime-v1
      - name: Checksum-verify official Blender LTS
        run: bash blender/scripts/install_blender.sh
      - name: Install verified VRM/MToon anime character importer
        run: bash blender/scripts/install_vrm_extension.sh
      - name: Animate and render Kai vs Ren cinematic encounter
        timeout-minutes: 125
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/.cache/blender/blender-4.5.16-linux-x64/blender"
          "$BIN" --background --factory-startup --disable-autoexec --python-exit-code 1 \
            --python blender/scripts/kai_ren_elite01.py
          test -s renders/kai-ren/elite-01/kai_ren_elite_01.blend
          count="$(find renders/kai-ren/elite-01 -maxdepth 1 -type f -name 'frame_*.png' | wc -l)"
          echo "Rendered $count image frames"
          test "$count" -eq 48
      - name: Synthesize sound, master and validate MP4
        run: |
          set -euo pipefail
          python3 blender/scripts/kai_ren_audio.py
          ffmpeg -hide_banner -loglevel error -y \
            -framerate 24 -start_number 1 \
            -i renders/kai-ren/elite-01/frame_%04d.png \
            -i renders/kai-ren/elite-01/kai_ren_original_audio.wav \
            -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p \
            -c:a aac -b:a 192k -t 2 \
            -movflags +faststart \
            renders/kai-ren/elite-01/kai_ren_cinematic_preview.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height \
            -of json renders/kai-ren/elite-01/kai_ren_cinematic_preview.mp4 \
            > renders/kai-ren/elite-01/media-check.json
          python3 - <<'PY'
          import json,os
          base='renders/kai-ren/elite-01/'
          assert os.path.getsize(base+'kai_ren_cinematic_preview.mp4') > 30000
          doc=json.load(open(base+'media-check.json'))
          streams=doc['streams']
          assert any(s['codec_name']=='h264' and s['width']==960 and s['height']==540 for s in streams)
          assert any(s['codec_name']=='aac' for s in streams)
          assert 1.9<float(doc['format']['duration'])<2.1
          film=json.load(open(base+'shot.json'))
          assert film['animation']['uses_real_vrm_armatures']
          assert film['animation']['uses_bone_ik']
          print('KAI_REN_VIDEO_AND_AUDIO_ACCEPTED')
          PY
      - name: Publish editable Blender scene, playable film and inspectable stills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kai-ren-cinematic-rigged-01
          path: |
            renders/kai-ren/elite-01/kai_ren_cinematic_preview.mp4
            renders/kai-ren/elite-01/kai_ren_elite_01.blend
            renders/kai-ren/elite-01/shot.json
            renders/kai-ren/elite-01/media-check.json
            renders/kai-ren/elite-01/frame_0001.png
            renders/kai-ren/elite-01/frame_0012.png
            renders/kai-ren/elite-01/frame_0027.png
            renders/kai-ren/elite-01/frame_0038.png
            renders/kai-ren/elite-01/frame_0048.png
          if-no-files-found: warn
          retention-days: 14
