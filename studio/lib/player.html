<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Original Studio Renderer</title></head>
<body style="margin:0;background:black"><canvas id="screen" width="360" height="640"></canvas>
<script type="module">
import {drawStudioFrame} from './templates.mjs';
import {bitmapText} from './core.mjs';
window.studioBitmapText=bitmapText;
window.studioReady=true;
window.renderStudioFrame=(shot,config,seconds,words)=>{
  const canvas=document.getElementById('screen');
  canvas.width=config.width;canvas.height=config.height;
  drawStudioFrame(canvas,shot,config,seconds,words||[]);
  return true;
};
</script></body></html>
